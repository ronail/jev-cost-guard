name: jev-cost-guard
version: "0.4.0"
description: >
  Opt-in jev annotation for tool results. Registers a `transform_tool_result`
  hook that APPENDS one line to oversized tool results — an `noul` verdict from
  jev (TypeSafe System One DECISION model) plus model and latency — and writes a
  structured JSONL record. It never replaces the result: jev returns typed
  decisions, never text, so a verdict cannot stand in for the bytes it judged.
  Matches TypeSafe's Harness Engineering use case ("detect tool-call errors",
  "log structured check results and probabilities"). Delegates to
  `mcp/jev/server.py --verdict`, so provider selection (TypeSafe direct when
  TYPESAFE_API_KEY is set, else the OpenCode zen relay) and every fallback rule
  live in the server, and the hook, MCP tools and Claude Code/Codex hooks share
  one implementation. Inert unless tools are listed in JEV_VERIFY_TOOLS (legacy
  JEV_GATE_TOOLS still works); only results over JEV_THRESHOLD tokens are
  annotated; JEV_SKIP_TOOLS is an optional second layer; fails open on any error;
  skips jev's own tools and already-annotated results. Enable in
  plugins.enabled to activate; install-only leaves it inactive.
author: "ronail/jev-cost-guard"
provides_hooks:
  - transform_tool_result
python_runtime: external
dependencies: []
